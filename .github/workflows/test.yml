name: Run Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    # Pyflakes only: undefined names, unused imports, unreachable code. No style
    # opinions, so it never argues with anyone about formatting. It exists because
    # splitting a module can turn a module global into an undefined name inside a
    # function body -- which the whole unit suite will happily pass over (it did,
    # once; see inference.py's ResultsManager import).
    name: Pyflakes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyflakes
      - run: pyflakes src/ tests/ examples/ scripts/

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the whole matrix when one combination fails — we want to
      # see exactly which OS / Python versions have problems.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        # pipx is preinstalled on all GitHub-hosted runners (Linux/macOS/Windows)
        run: pipx install poetry

      - name: Install Dependencies
        run: poetry install

      - name: Run Tests with Coverage
        run: poetry run pytest --cov=cccpm --cov-report=xml --cov-report=term

      - name: Upload coverage to Coveralls
        # Upload coverage from a single representative job to avoid duplicates.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
